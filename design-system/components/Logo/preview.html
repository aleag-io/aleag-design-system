<!-- @dsCard group="Brand" height=260 subtitle="Full logo and frame mark in the brand colors" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Logo</title>
<style>body{margin:0;background:var(--canvas)}#root{display:flex;flex-wrap:wrap;align-items:center;gap:24px;padding:24px}.tile{display:grid;place-items:center;padding:14px;border-radius:var(--radius-md)}.navy{background:var(--inverse-surface)}.white{background:#fff;border:1px solid var(--border)}.cream{background:#f6f1e7}</style>
</head><body><div id="root"></div>
<script>
var A=window.Aleag,h=React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 h('div',{className:'tile white'},h(A.Logo,{size:170})),
 h('div',{className:'tile navy'},h(A.Logo,{tone:'gold',size:170})),
 h('div',{className:'tile cream'},h(A.Logo,{tone:'bronze',size:150})),
 h('div',{className:'tile navy'},h(A.Logo,{tone:'rose-gold',size:120})),
 h('div',{className:'tile navy'},h(A.Logo,{tone:'silver',size:120})),
 h('div',{className:'tile white'},h(A.Logo,{variant:'mark',size:64})),
 h('div',{className:'tile navy'},h(A.Logo,{variant:'mark',tone:'gold',size:40}))));
</script></body></html>
