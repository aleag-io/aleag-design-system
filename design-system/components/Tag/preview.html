<!doctype html>
<html><head><meta charset="utf-8"><title>Tag</title>
<style>body{margin:0;background:var(--canvas)}#root{display:grid;gap:16px;padding:24px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}</style>
</head><body><div id="root"></div>
<script>
var A=window.Aleag,h=React.createElement;
function Filters(){var s=React.useState('All'),cur=s[0],set=s[1];
 return h('div',{className:'row',role:'group','aria-label':'Filter posts'},[['All',12],['Home lab',5],['Microsoft 365',3],['Woodworking',4]].map(function(t){return h(A.Tag,{key:t[0],selected:cur===t[0],count:t[1],onClick:function(){set(t[0]);}},t[0]);}));}
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment,null,
 h(Filters),
 h('div',{className:'row'},h(A.Tag,{size:'sm'},'Temporal'),h(A.Tag,{size:'sm'},'Azure'),h(A.Tag,{size:'sm',href:'#'},'Plex'),h(A.Tag,{size:'sm',tone:'workshop'},'Walnut'),h(A.Tag,{size:'sm',tone:'workshop'},'Hand-cut joinery'))));
</script></body></html>
